name: A line stopped me
description: You had to run a line to know what it did. That is the measurement this repository is actually for.
title: "stopped at L"
labels: ["readability"]
body:
  - type: markdown
    attributes:
      value: |
        The file has no comments by design — the function names are supposed to
        do that work. Where that fails, the design fails, and I would rather
        know than not. There is no wrong answer here and no experience level
        required.

  - type: input
    id: line
    attributes:
      label: Which line
      description: A line number, or a range. A permalink is even better.
      placeholder: "L35-L36"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you expected it to do, before you found out
      description: This is the useful half. The gap between your reading and the behaviour is the bug.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: What made it click
      description: Printing a shape, reading another file, asking someone. Optional.
    validations:
      required: false
